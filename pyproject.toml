[project]
name = "horaro-discord"
version = "0.2.0"
description = "Discord bot that notifies Horaro schedule programs"
authors = [{ name = "drago-suzuki58", email = "dorasuzu58@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11",
    "discord-py>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
horaro-discord = "horaro_discord.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# aiohttp takes its own timeout, so timeout parameters are passed through on purpose.
ignore = ["ASYNC109"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
